name: Deploy Horizen Testnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: horizen-testnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run compile
      - name: Verify Horizen testnet RPC
        run: npm run check:testnet
        env:
          HORIZEN_TESTNET_RPC_URL: https://horizen-testnet.rpc.caldera.xyz/http
      - name: Deploy Symbasis stack
        run: npm run deploy:testnet
        env:
          PRIVATE_KEY: ${{ secrets.HORIZEN_DEPLOYER_PRIVATE_KEY }}
          HORIZEN_TESTNET_RPC_URL: https://horizen-testnet.rpc.caldera.xyz/http
      - uses: actions/upload-artifact@v4
        with:
          name: symbasis-horizen-testnet-deployment
          path: deployments/horizen-testnet.json
          if-no-files-found: error
