name: Deploy Horizen Testnet

on:
  workflow_dispatch:
    inputs:
      oracle_mode:
        description: Oracle mode for this deployment
        required: true
        default: demo
        type: choice
        options:
          - demo
          - stork

permissions:
  contents: read

concurrency:
  group: symbasis-horizen-testnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: horizen-testnet
    env:
      HORIZEN_TESTNET_RPC_URL: https://horizen-testnet.rpc.caldera.xyz/http
      ORACLE_MODE: ${{ inputs.oracle_mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck deployment tooling
        run: npm run typecheck

      - name: Compile contracts
        run: npm run compile

      - name: Run full contract test suite
        run: npm test

      - name: Verify live Horizen testnet
        run: npm run check:testnet

      - name: Validate deployer credential is configured
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.HORIZEN_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_KEY:-}" ]; then
            echo "HORIZEN_DEPLOYER_PRIVATE_KEY is not configured in the horizen-testnet environment."
            exit 1
          fi

      - name: Validate Stork credential when Stork mode is selected
        if: ${{ inputs.oracle_mode == 'stork' }}
        shell: bash
        env:
          STORK_API_KEY: ${{ secrets.STORK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STORK_API_KEY:-}" ]; then
            echo "STORK_API_KEY is required only when oracle_mode=stork. Use demo mode to deploy without it."
            exit 1
          fi

      - name: Deploy and finalize Symbasis stack
        run: npm run deploy:testnet
        env:
          PRIVATE_KEY: ${{ secrets.HORIZEN_DEPLOYER_PRIVATE_KEY }}

      - name: Verify deployed contracts on Horizen
        run: npm run verify:testnet

      - name: Run ETH-PERP end-to-end smoke trade
        run: npm run smoke:testnet
        env:
          PRIVATE_KEY: ${{ secrets.HORIZEN_DEPLOYER_PRIVATE_KEY }}
          STORK_API_KEY: ${{ secrets.STORK_API_KEY }}

      - name: Upload verified deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: symbasis-horizen-testnet-deployment-${{ inputs.oracle_mode }}
          path: |
            deployments/horizen-testnet.json
            deployments/horizen-testnet.web.env
            deployments/horizen-testnet-smoke.json
          if-no-files-found: error
          retention-days: 30
