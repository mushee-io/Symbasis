name: Symbasis CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run compile
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: web
        run: npm install
      - name: Audit production web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run build

  horizen-testnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify live RPC, chain ID, block and Stork contract
        run: npm run check:testnet
        env:
          HORIZEN_TESTNET_RPC_URL: https://horizen-testnet.rpc.caldera.xyz/http
